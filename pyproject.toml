[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "presidio-evidence"
version = "0.5.1"
description = "Signed-evidence substrate for the presidio-hardened-* family: canonical JSON, Ed25519/HMAC evidence refs and fail-closed verification. Schemas and golden vectors are the contract. Independent of Microsoft Presidio."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Presidio Security" }]
keywords = [
    "presidio",
    "hardening",
    "security-engineering",
    "evidence",
    "ed25519",
    "audit",
    "eu-ai-act",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/presidio-v/presidio-evidence"
Source = "https://github.com/presidio-v/presidio-evidence"
Issues = "https://github.com/presidio-v/presidio-evidence/issues"
Changelog = "https://github.com/presidio-v/presidio-evidence/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Ed25519 signing/verification. HMAC-SHA256 and Layer 0 are stdlib-only, so the
# runtime stays dependency-free; consumers needing Ed25519 install this extra.
crypto = ["cryptography>=42"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "jsonschema>=4.21",
    "cryptography>=42",
]

[project.scripts]
presidio-evidence = "presidio_evidence._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/presidio_evidence"]

# The contract ships with the code: schemas/ and vectors/ become package data
# under presidio_evidence/_contract/ (read via presidio_evidence.schemas_dir()).
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "presidio_evidence/_contract/schemas"
"vectors" = "presidio_evidence/_contract/vectors"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 100

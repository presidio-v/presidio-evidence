name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --require-hashes -r .github/constraints/ci-toolchain.txt
          python -m pip install --require-hashes -r .github/constraints/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint (incl. ruff S security rules — SAST lane 1)
        run: |
          ruff check .
          ruff format --check .
      - name: Vector stability (append-only discipline, ADR-0001 D5)
        run: python scripts/generate_vectors.py --check
      - name: Conformance tests with coverage gate
        run: pytest tests/ -q --cov=presidio_evidence --cov-report=term-missing
      - name: Dependency audit
        run: pip-audit
      - name: SBOM (CycloneDX)
        run: |
          python -m pip install --require-hashes -r .github/constraints/cyclonedx.txt
          cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  compat:
    # The test suite on the other supported Pythons; the full gate runs above.
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --require-hashes -r .github/constraints/ci-toolchain.txt
          python -m pip install --require-hashes -r .github/constraints/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Tests
        run: pytest tests/ -q

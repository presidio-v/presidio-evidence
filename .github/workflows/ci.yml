name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (incl. ruff S security rules — SAST lane 1)
        run: |
          ruff check .
          ruff format --check .
      - name: Vector stability (append-only discipline, ADR-0001 D5)
        run: python scripts/generate_vectors.py --check
      - name: Conformance tests with coverage gate
        run: pytest tests/ -q --cov=presidio_evidence --cov-report=term-missing
      - name: Dependency audit
        run: pip-audit
      - name: SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json

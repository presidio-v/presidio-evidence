name: Rust CI

# Cross-language conformance lane: the Rust toolchain must reproduce the golden
# vectors byte-for-byte (rust/tests/conformance.rs).
#
# Promoted to push/pull_request after validating green locally (fmt + clippy
# -D warnings + conformance tests, 2026-06-12) — ADR-0001 action item 6.
# workflow_dispatch retained for manual re-runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  conformance-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Conformance tests
        run: cargo test --manifest-path rust/Cargo.toml

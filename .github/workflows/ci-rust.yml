name: Rust CI

# Cross-language conformance lane: the Rust toolchain must reproduce the golden
# vectors byte-for-byte (rust/tests/conformance.rs).
#
# MANUAL TRIGGER (workflow_dispatch) ONLY for now — family precedent is the
# hardened-ai ci-zk lane: the development environment lacks a Rust toolchain, so
# this lane has not yet run green locally; gating pushes on an unvalidated lane
# produces spurious red CI. Run it once from the Actions tab; when green, promote
# to push/pull_request (ADR-0001 action item 6).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  conformance-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Conformance tests
        run: cargo test --manifest-path rust/Cargo.toml

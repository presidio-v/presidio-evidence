[package]
name = "presidio-evidence"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Shared evidence substrate for the presidio-hardened-* suite (Rust side). Schema and golden test vectors at the repo root are the contract; this crate conforms to them. Independent of Microsoft Presidio."
publish = false # not on crates.io yet; consumers use a git dependency

[dependencies]
# Layer 0 only (ADR-0001 D1): canonical JSON + SHA-256 content addressing.
# `serde_json` must stay WITHOUT `preserve_order` — sorted keys are the contract.
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
hmac = "0.13"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
